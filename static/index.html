<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模拟装配 · eve-skill-planner</title>
<style>
:root{--bg:#14161a;--p:#1c1f26;--p2:#22262f;--b:#2e333d;--t:#cfd4dc;--m:#8b93a1;--a:#7aa2ff;--r:#ff6b6b;--g:#5fe08b;--y:#e8c06a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font:13px/1.5 "Microsoft YaHei","PingFang SC",sans-serif}
input,select,textarea,button{font:inherit;background:#171a20;color:var(--t);border:1px solid var(--b);border-radius:4px;padding:5px 8px}
button{cursor:pointer;background:var(--p2);min-width:40px;white-space:nowrap}
button:hover{border-color:var(--a)} button.prim{background:#2b4a7a;border-color:#3a5f9e}
button.sm{padding:3px 6px;font-size:11px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--a)}
a{color:var(--a);cursor:pointer}.m{color:var(--m)}.r{color:var(--r)}.g{color:var(--g)}
header{display:flex;align-items:center;gap:12px;padding:6px 14px;border-bottom:1px solid var(--b);background:var(--p);font-size:13px}
main{display:grid;grid-template-columns:300px 1fr 296px;min-height:calc(100vh - 41px)}
.l,.r{background:var(--p);overflow-y:auto}
.l{border-right:1px solid var(--b);display:flex;flex-direction:column}
.c{overflow-y:auto;padding:12px;border-right:1px solid var(--b)}
.tabs{display:flex;border-bottom:1px solid var(--b)} .tabs button{flex:1;border:none;border-radius:0;background:transparent;padding:7px 0}
.tabs button.on{color:#fff;border-bottom:2px solid var(--a)}
.pad{padding:8px;flex:1;overflow-y:auto}
.row{display:flex;align-items:center;gap:6px;padding:2px 0}
.item-row{cursor:pointer;padding:3px 6px}
.item-row:hover{background:var(--p2)} .item-row.sel{background:#243651}
.item-row img{width:24px;height:24px;border-radius:3px}
.slist{border:1px solid var(--b);border-radius:4px;overflow-y:auto;flex:1;min-height:0}
.slot{margin-bottom:8px}
.slot h4{padding:3px 8px;border-radius:4px;font-size:12px;margin-bottom:2px;font-weight:400}
.high h4{background:#3a2428}.med h4{background:#1e2b3a}.low h4{background:#2b2415}.rig h4{background:#1d2b1d}
.sitem{display:flex;align-items:center;gap:6px;padding:2px 6px;border:1px solid var(--b);border-radius:4px;margin-bottom:2px;cursor:pointer;background:var(--p2)}
.sitem:hover{border-color:var(--a)} .sitem img{width:22px;height:22px}
.shipimg{text-align:center;margin:8px 0}
.shipimg img{max-width:90%;max-height:240px}
.gauge{display:grid;grid-template-columns:44px 1fr 70px;gap:4px;align-items:center;margin-bottom:4px}
.gauge .bar{height:7px;background:#12151a;border-radius:3px;overflow:hidden}
.gauge .bar i{display:block;height:100%;background:var(--a)} .gauge .bar i.over{background:var(--r)}
.rtabs{display:flex;border-bottom:1px solid var(--b);flex-wrap:wrap}
.rtabs button{border:none;background:transparent;border-radius:0;padding:6px 0;flex:1;font-size:12px;min-width:42px}
.rtabs button.on{color:#fff;border-bottom:2px solid var(--a)}
.rpad{padding:10px}
.kv{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted var(--b)}
.kv .k{color:var(--m)} .kv .w{color:var(--r)}
table{width:100%;border-collapse:collapse;font-size:11px}
td,th{padding:2px 5px;border:1px solid var(--b);text-align:right}
th{color:var(--m);font-weight:400;background:var(--p2)} td:first-child,th:first-child{text-align:left}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--p);border:1px solid var(--b);border-radius:8px;min-width:400px;max-width:600px;padding:14px;max-height:80vh;overflow-y:auto}
.modal h3{margin-bottom:10px} .modal textarea{width:100%;height:180px;font-family:monospace}
.modal .act{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.qty{width:50px;padding:2px 4px}.chip{background:var(--p2);border:1px solid var(--b);border-radius:10px;padding:1px 7px;font-size:11px;color:var(--m)}
</style>
</head>
<body>
<div id="app">
<header>
 <b>⛵ 模拟装配</b>
 <select v-model="charId" @change="onChar"><option :value="null">无角色</option><option v-for="c in chars" :key="c.id" :value="c.id">{{c.name}}</option></select>
 <button class="sm" @click="authStart">授权</button>
 <span class="chip" v-if="charId">ISK {{isk}}</span>
 <span class="chip m" v-if="charId&&!hasSkills">无技能scope</span>
</header>
<main>
<!-- ===== 左栏 ===== -->
<section class="l">
 <nav class="tabs">
  <button :class="{on:lt==='hull'}" @click="lt='hull'">船体与装配</button>
  <button :class="{on:lt==='mod'}" @click="lt='mod'">装备</button>
  <button :class="{on:lt==='ammo'}" @click="lt='ammo'">弹药</button>
 </nav>
 <div class="pad">
  <!-- 船体 -->
  <template v-if="lt==='hull'">
   <input v-model="sq" placeholder="搜舰船…" style="width:100%;margin-bottom:4px;flex-shrink:0">
   <div class="slist" v-if="fShips.length">
    <template v-for="g in shipGroups" :key="g">
    <template v-if="shipsByGroup(g).length">
     <div class="item-row" style="cursor:pointer;font-weight:600;gap:4px" @click="expanded[g]=!expanded[g]">
      <span style="font-size:11px;width:12px;flex-shrink:0">{{expanded[g]?'▼':'▶'}}</span>
      {{g}} <span class="m" style="font-size:11px;font-weight:400;margin-left:auto">{{shipsByGroup(g).length}} 艘</span>
     </div>
     <template v-if="expanded[g]">
      <div v-for="s in shipsByGroup(g)" :key="s.tid">
       <div class="item-row" :class="{sel:s.tid===shipTid}" @click="pickShip(s.tid)" style="padding-left:22px">{{s.name}}</div>
       <div v-for="f in (fittingsByShip[s.name]||[])" :key="f.k" class="item-row" @click="loadFit(f)" style="padding-left:38px;font-size:12px;color:var(--a)">{{f.esi?'🌐':'⚙'}} {{f.name}}</div>
      </div>
     </template>
    </template>
   </template>
   </div>
   <div class="m" style="padding:6px" v-if="!fShips.length">匹配{{sq?'无结果':'输入搜索'}}</div>
  </template>
  <!-- 装备/弹药 -->
  <template v-else>
   <div class="row" style="margin-bottom:4px"><input v-model="iq" placeholder="搜索…" style="flex:1" @keyup.enter="searchItems"><button @click="searchItems">搜</button></div>
   <div style="max-height:180px;overflow-y:auto;margin-bottom:8px">
    <div v-for="r in iResults" :key="r.tid" class="item-row" @click="addItem(r)">
     <img :src="icon(r.tid)">{{r.name}} <span class="m">{{r.group}}</span>
     <span style="margin-left:auto;font-size:11px;color:var(--m)">{{r.pg!=null?'PG '+r.pg:''}} {{r.cpu!=null?'CPU '+r.cpu:''}}</span></div>
    <div class="m" style="padding:4px" v-if="!iResults.length&&iq">无结果</div>
   </div>
   <div><b>装配单</b> <button class="sm" @click="buildList=[];doSim()">清空</button></div>
   <div v-for="(it,i) in buildList" :key="i" class="row">
   <img :src="icon(it.tid)" style="width:22px;height:22px">{{it.name}}
   <span style="font-size:11px;color:var(--m);white-space:nowrap">{{it.pg!=null?'PG '+it.pg:''}} {{it.cpu!=null?'CPU '+it.cpu:''}}</span>
   <input class="qty" v-model.number="it.qty" @change="doSim"><button class="sm" @click="buildList.splice(i,1);doSim()">✕</button></div>
   <div class="m" style="padding:4px" v-if="!buildList.length">未添加</div>
   <button class="prim" style="width:100%;margin-top:6px" @click="doSim">模拟</button>
  </template>
 </div>
 <div style="display:flex;gap:6px;padding:8px;border-top:1px solid var(--b);flex-wrap:wrap">
  <button @click="modShip=true">装配舰船…</button>
  <button @click="saveName='';modSave=true">另存为…</button>
  <button @click="eftText='';modEft=true">上传 EFT</button>
 </div>
</section>
<!-- ===== 中央 ===== -->
<section class="c">
 <div style="display:flex;justify-content:space-between;margin-bottom:6px"><b>{{shipName}}</b> <span class="m" v-if="fitName">· {{fitName}}</span></div>
 <div class="shipimg" v-if="shipTid"><img :src="'https://images.evetech.net/types/'+shipTid+'/render?size=256'"></div>
 <div class="m" style="text-align:center;padding:40px" v-else>← 左侧选舰船或粘贴EFT</div>
 <template v-if="sim">
  <div class="slot high" v-if="slots.high.length||cap('high')"><h4>高槽 {{slots.high.length}}/{{cap('high')}}</h4>
   <div v-for="(it,i) in slots.high" :key="i" class="sitem" @click="rmItem(it)"><img :src="icon(it.tid)"><span style="flex:1">{{it.name}}</span><span style="font-size:11px;color:var(--m)" v-if="it.attrs[30]||it.attrs[50]">PG {{it.attrs[30]}} CPU {{it.attrs[50]}}</span><span class="chip" v-if="it.qty>1">×{{it.qty}}</span></div>
   <div v-for="i in emp('high')" :key="'he'+i" class="sitem" style="opacity:.3"><span class="m">(空)</span></div>
  </div>
  <div class="slot med" v-if="slots.med.length||cap('med')"><h4>中槽 {{slots.med.length}}/{{cap('med')}}</h4>
   <div v-for="(it,i) in slots.med" :key="i" class="sitem" @click="rmItem(it)"><img :src="icon(it.tid)"><span style="flex:1">{{it.name}}</span><span style="font-size:11px;color:var(--m)" v-if="it.attrs[30]||it.attrs[50]">PG {{it.attrs[30]}} CPU {{it.attrs[50]}}</span></div>
   <div v-for="i in emp('med')" :key="'me'+i" class="sitem" style="opacity:.3"><span class="m">(空)</span></div>
  </div>
  <div class="slot low" v-if="slots.low.length||cap('low')"><h4>低槽 {{slots.low.length}}/{{cap('low')}}</h4>
   <div v-for="(it,i) in slots.low" :key="i" class="sitem" @click="rmItem(it)"><img :src="icon(it.tid)"><span style="flex:1">{{it.name}}</span><span style="font-size:11px;color:var(--m)" v-if="it.attrs[30]||it.attrs[50]">PG {{it.attrs[30]}} CPU {{it.attrs[50]}}</span></div>
   <div v-for="i in emp('low')" :key="'le'+i" class="sitem" style="opacity:.3"><span class="m">(空)</span></div>
  </div>
  <div class="slot rig" v-if="slots.rig.length||cap('rig')"><h4>改装件 {{slots.rig.length}}/{{cap('rig')}}</h4>
   <div v-for="(it,i) in slots.rig" :key="i" class="sitem" @click="rmItem(it)"><img :src="icon(it.tid)"><span style="flex:1">{{it.name}}</span><span style="font-size:11px;color:var(--m)" v-if="it.attrs[30]||it.attrs[50]">PG {{it.attrs[30]}} CPU {{it.attrs[50]}}</span></div>
   <div v-for="i in emp('rig')" :key="'re'+i" class="sitem" style="opacity:.3"><span class="m">(空)</span></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">
   <span class="chip" v-if="res.cargo?.cap<1e9">货舱 <span :class="over('cargo')">{{n(res.cargo.used)}}/{{n(res.cargo.cap)}} m³</span></span>
   <span class="chip" v-if="res.drone_bay?.cap">机库 {{n(res.drone_bay.used)}}/{{n(res.drone_bay.cap)}} m³</span>
   <span class="chip" v-for="c in sim.other.charge" :key="'ch'+c.tid">{{c.name}} ×{{c.qty}}</span>
   <span class="chip" v-for="c in sim.other.drone" :key="'dr'+c.tid">{{c.name}} ×{{c.qty}}</span>
   <span class="chip m" v-if="sim.unknowns?.length">未识别：{{sim.unknowns.join('、')}}</span>
  </div>
  <div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;font-size:13px">
   <span>CPU <b :class="over('cpu')">{{n(res.cpu.used)}}/{{n(res.cpu.cap)}}</b></span>
   <span>能量栅格 <b :class="over('pg')">{{n(res.pg.used)}}/{{n(res.pg.cap)}}</b></span>
   <span>炮台 <b>{{res.turret.used}}/{{res.turret.cap}}</b></span>
  </div>
 </template>
</section>
<!-- ===== 右栏 ===== -->
<aside class="r">
 <nav class="rtabs">
  <button :class="{on:rt==='res'}" @click="rt='res'">资源</button>
  <button :class="{on:rt==='def'}" @click="rt='def'">抗性</button>
  <button :class="{on:rt==='atk'}" @click="rt='atk'">火力</button>
  <button :class="{on:rt==='cap'}" @click="rt='cap'">电容</button>
  <button :class="{on:rt==='tgt'}" @click="rt='tgt'">目标</button>
  <button :class="{on:rt==='nav'}" @click="rt='nav'">航行</button>
 </nav>
 <div class="rpad" v-if="sim">
  <template v-if="rt==='res'">
   <div class="gauge"><span>PG</span><div class="bar"><i :class="over('pg')" :style="{width:pct(res.pg)+'%'}"></i></div><span>{{n(res.pg.used)}}/{{n(res.pg.cap)}}</span></div>
   <div class="gauge"><span>CPU</span><div class="bar"><i :class="over('cpu')" :style="{width:pct(res.cpu)+'%'}"></i></div><span>{{n(res.cpu.used)}}/{{n(res.cpu.cap)}}</span></div>
   <div class="kv"><span class="k">炮台安装数</span><span>{{res.turret.used}}/{{res.turret.cap}}</span></div>
   <div class="kv"><span class="k">发射器安装数</span><span>{{res.launcher.used}}/{{res.launcher.cap}}</span></div>
   <div class="kv"><span class="k">校准值</span><span>{{res.calibration.used}}/{{res.calibration.cap}}</span></div>
   <div class="kv"><span class="k">货舱</span><span :class="over('cargo')">{{n(res.cargo.used)}}/{{n(res.cargo.cap)}} m³</span></div>
   <table><tr><th></th><th>高</th><th>中</th><th>低</th><th>改</th></tr><tr><td>槽</td><td>{{res.slots_cap.high}}</td><td>{{res.slots_cap.med}}</td><td>{{res.slots_cap.low}}</td><td>{{res.slots_cap.rig}}</td></tr></table>
  </template>
  <template v-if="rt==='def'">
   <div class="kv" style="margin-bottom:4px"><button class="sm" @click="ehp=ehp==='e'?'r':'e'" style="float:right">{{ehp==='e'?'有效HP':'原始HP'}}</button></div>
   <table><tr><th></th><th>EM</th><th>爆</th><th>动</th><th>热</th><th>HP</th><th v-if="ehp==='e'">EHP</th></tr>
    <tr v-for="(l,k) in [['护盾','shield'],['装甲','armor'],['结构','hull']]" :key="k[1]"><td>{{l[0]}}</td>
     <td v-for="v in sim.resists[l[1]]" :key="l[1]+v">{{v}}%</td>
     <td>{{n(sim.ehp.layers[l[1]].hp)}}</td><td v-if="ehp==='e'">{{n(sim.ehp.layers[l[1]].ehp)}}</td></tr>
   </table>
   <div class="kv"><span class="k">总有效HP</span><b>{{n(sim.ehp.total)}}</b></div>
   <div class="kv"><span class="k">装甲维修</span><span>{{sim.repair.armor}} hp/s</span></div>
   <div class="kv"><span class="k">护盾回充</span><span>{{sim.repair.shield}} hp/s</span></div>
  </template>
  <template v-if="rt==='atk'">
   <div class="kv"><span class="k">炮台 DPS</span><b>{{sim.firepower.turret.dps}}</b></div>
   <div class="kv"><span class="k">炮台齐射</span><span>{{n(sim.firepower.turret.volley)}}</span></div>
   <div class="kv"><span class="k">发射架 DPS</span><span>{{sim.firepower.launcher.dps}}</span></div>
   <div class="kv"><span class="k">无人机 DPS</span><span>{{sim.firepower.drone.dps}}</span></div>
   <div class="kv"><span class="k">总 DPS</span><b>{{sim.firepower.total}}</b></div>
   <table><tr><th>武器</th><th>DPS</th><th>弹药</th></tr>
    <tr v-for="w in sim.firepower.weapons" :key="w.tid+w.charge"><td>{{w.name}} <span class="m" v-if="w.qty>1">×{{w.qty}}</span></td><td>{{w.dps}}</td><td>{{w.charge||'—'}}</td></tr>
   </table>
  </template>
  <template v-if="rt==='cap'">
   <div class="kv"><span class="k">容量</span><b>{{n(sim.capacitor.capacity)}} GJ</b></div>
   <div class="kv"><span class="k">回充时间</span><span>{{n(sim.capacitor.recharge)}} s</span></div>
   <div class="kv"><span class="k">峰值回充</span><span>{{sim.capacitor.peak}} GJ/s</span></div>
   <div class="kv"><span class="k">消耗(全激活)</span><span>{{sim.capacitor.drain}} GJ/s</span></div>
   <div class="kv"><span class="k">状态</span><b :class="sim.capacitor.stable?'g':'r'">{{sim.capacitor.stable?'稳定 ∞':'不稳定'}}</b></div>
   <div class="kv" v-if="!sim.capacitor.stable"><span class="k">耗尽</span><span class="r">{{fmtT(sim.capacitor.deplete)}}</span></div>
  </template>
  <template v-if="rt==='tgt'">
   <div class="kv"><span class="k">锁定范围</span><span>{{n(sim.targeting.range)}} m</span></div>
   <div class="kv"><span class="k">锁定时间</span><span>{{sim.targeting.lock_time}} s</span></div>
   <div class="kv"><span class="k">扫描分辨率</span><span>{{n(sim.targeting.scan_res)}} mm</span></div>
   <div class="kv"><span class="k">最大目标数</span><span>{{sim.targeting.max_targets}}</span></div>
   <div class="kv"><span class="k">信号半径</span><span>{{n(sim.targeting.signature)}} m</span></div>
  </template>
  <template v-if="rt==='nav'">
   <div class="kv"><span class="k">速度</span><b>{{n(sim.nav.speed)}} m/s</b></div>
   <div class="kv"><span class="k">质量</span><span>{{n(sim.nav.mass)}} t</span></div>
   <div class="kv"><span class="k">惯性系数</span><span>{{sim.nav.agility}}</span></div>
   <div class="kv"><span class="k">起跳时间</span><span>{{sim.nav.align}} s</span></div>
   <div class="kv"><span class="k">跃迁速度</span><span>{{sim.nav.warp}} AU/s</span></div>
  </template>
 </div>
 <div class="m" style="text-align:center;padding:40px" v-else>选舰船 + 添加装备</div>
</aside>
</main>

<!-- ===== 模态 ===== -->
<div class="modal-mask" v-if="modShip">
 <div class="modal"><h3>选择舰船</h3><input v-model="sq2" placeholder="搜索…" style="width:100%"><div style="max-height:300px;overflow-y:auto;margin-top:6px">
  <div v-for="s in filterShips2" :key="s.tid" class="item-row" @click="pickShip(s.tid);modShip=false"><img :src="icon(s.tid)">{{s.name}} <span class="m">{{s.group}}</span></div></div>
  <div class="act"><button @click="modShip=false">取消</button></div></div>
</div>
<div class="modal-mask" v-if="modEft">
 <div class="modal"><h3>粘贴 EFT</h3><textarea v-model="eftText" placeholder="[审判者级, 装配名]&#10;小型聚焦脉冲激光器 II x4&#10;…"></textarea>
  <div class="act"><button @click="modEft=false">取消</button><button class="prim" @click="doEft">解析并模拟</button></div></div>
</div>
<div class="modal-mask" v-if="modSave">
 <div class="modal"><h3>另存为</h3><input v-model="saveName" placeholder="装配名" style="width:100%">
  <div class="act"><button @click="modSave=false">取消</button><button @click="saveLocal">本地</button><button class="prim" :disabled="!charId" @click="saveEsi">EVE</button></div>
  <div class="m" style="margin-top:6px" v-if="!charId">保存到 EVE 需选择角色并授权 write scope</div></div>
</div>
</div>
<script src="/static/vendor/vue.global.prod.js"></script>
<script src="/static/app.js?v=18"></script>
</body></html>
